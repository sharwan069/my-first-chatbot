<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My First AI Chatbot</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <main class="chat-container">
      <header class="chat-header">
        <h1>My First AI Chatbot</h1>
        <p>Powered by Pawan power Star</p>
      </header>

      <section id="chat-messages" class="chat-messages" aria-live="polite">
        <div class="message ai">
          Hello! I'm your AI assistant. Ask me anything to get started.
        </div>
      </section>

      <div id="loading" class="loading hidden">AI is thinking...</div>
      <div id="error" class="error hidden"></div>

      <div class="chat-input-area">
        <input
          type="text"
          id="user-input"
          placeholder="Type your message..."
          autocomplete="off"
        />
        <button id="send-button">Send</button>
      </div>
    </main>

    <script src="/src/js/script.js"></script>
  </body>
</html>
